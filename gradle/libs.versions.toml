[versions]
agp = "9.4.1"
kotlin = "2.3.21"
android-compileSdk = "37"
android-minSdk = "24"
android-targetSdk = "36"
composeBom = "2026.09.00"
activityCompose = "1.13.0"
datastore = "1.3.0"
vanniktech-maven-publish = "0.36.0"
datastoreExtensions = "0.3.0"

[libraries]
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
compose-runtime = { group = "androidx.compose.runtime", name = "runtime" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-material3 = { group = "androidx.compose.material3", name = "material3" }
activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
# 发布验证用（-PconsumeRemote）：JitPack 托管的正式产物，匿名可拉；版本须已发布（GitHub Release 触发 + JitPack 构建过）
datastore-extensions = { module = "com.github.LiJoeAllen:DataStoreExtensions", version.ref = "datastoreExtensions" }
kotlin-compiler-embeddable = { group = "org.jetbrains.kotlin", name = "kotlin-compiler-embeddable", version.ref = "kotlin" }
# buildSrc 的 convention plugin 引用 KGP / vanniktech 类型所需，版本与上方插件保持同一单一来源
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
vanniktech-gradle-plugin = { module = "com.vanniktech:gradle-maven-publish-plugin", version.ref = "vanniktech-maven-publish" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
vanniktech-maven-publish = { id = "com.vanniktech.maven.publish", version.ref = "vanniktech-maven-publish" }
